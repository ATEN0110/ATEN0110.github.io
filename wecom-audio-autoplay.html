<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    >
    <title>WeCom Audio Autoplay Demo</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        background: #f5f7fb;
        color: #1f2d3d;
      }
      .page {
        max-width: 720px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 8px;
      }
      .hint {
        font-size: 14px;
        line-height: 1.6;
        color: #5f6b7a;
        margin-bottom: 16px;
      }
      .controls {
        display: flex;
        gap: 12px;
        margin: 16px 0;
      }
      button {
        padding: 10px 16px;
        border-radius: 6px;
        border: 1px solid #c9d3e0;
        background: #fff;
        font-size: 14px;
      }
      button.primary {
        background: #2d8cf0;
        color: #fff;
        border-color: #2d8cf0;
      }
      .status-label {
        font-size: 12px;
        text-transform: uppercase;
        color: #8a96a3;
        letter-spacing: 0.08em;
        margin: 8px 0 4px;
      }
      .status {
        background: #111827;
        color: #f9fafb;
        padding: 12px;
        border-radius: 6px;
        font-size: 12px;
        white-space: pre-wrap;
        min-height: 44px;
      }
      audio {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <h1>WeCom Audio Autoplay Demo</h1>
      <p class="hint">
        This page demonstrates common autoplay hooks used inside WeCom. Replace the
        audio source URL with your own file, then ensure wx.config and wx.agentConfig
        are provided by your backend.
      </p>
      <audio
        id="bg-audio"
        preload="auto"
        playsinline
        webkit-playsinline
      >
        <source src="https://www.w3schools.com/html/horse.mp3" type="audio/mpeg">
      </audio>
      <div class="controls">
        <button id="play-btn" class="primary" type="button">Play</button>
        <button id="pause-btn" type="button">Pause</button>
      </div>
      <div class="status-label">Status</div>
      <pre id="status" class="status">Idle</pre>
    </main>
    <script src="https://open.work.weixin.qq.com/wwopen/js/jwxwork-1.0.0.js"></script>
    <script src="js/wecom-audio-autoplay.js"></script>
  </body>
</html>
